[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smriti-api"
version = "0.1.0"
description = "FastAPI gateway + LangGraph for AI-agent-powered patient memory layer"
requires-python = ">=3.11"
authors = [
    { name = "Smriti Team" }
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "cryptography>=42.0.0",
    "supabase>=2.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
    "langgraph>=0.0.1",
    "langchain>=0.1.0",
    "langchain-groq>=0.1.0",
    "sentence-transformers>=2.2.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "rapidfuzz>=3.5.0",
    "fhir.resources>=7.0.0",
    "hl7apy>=1.3.3",
    "pdfplumber>=0.10.0",
    "slowapi>=0.1.9",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.25.0",
    "structlog>=23.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smriti"]

[tool.pytest.ini_options]
markers = [
    "slow: exercises real external dependencies or longer end-to-end flows",
]
