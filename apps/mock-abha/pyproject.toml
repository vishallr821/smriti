[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mock-abha"
version = "0.1.0"
description = "Mock ABHA (Ayushman Bharat Health Account) service for testing"
requires-python = ">=3.11"
authors = [
    { name = "Smriti Team" }
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyjwt>=2.8.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mock_abha"]
