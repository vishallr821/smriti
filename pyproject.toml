[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smriti-monorepo"
version = "0.1.0"
description = "Smriti: AI-agent-powered patient memory layer monorepo"
requires-python = ">=3.11"

[tool.hatch.build]
packages = []

# Project configuration for development
[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
